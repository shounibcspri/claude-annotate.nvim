# --- annotate claude's response, then submit every note as one message ---
# prefix + i opens a popup over this pane holding a snapshot of its output:
#   V + j/k select a block, <leader>cm comments it, <leader>pp submits and closes.
# display-popup does not expand formats in its command, but run-shell does, so the
# pane id has to be substituted one level out. -b keeps the server responsive.
bind i run-shell -b 'tmux display-popup -E -w 90% -h 90% "nvim -c \"lua require([[claude-annotate]]).open([[#{pane_id}]])\""'
